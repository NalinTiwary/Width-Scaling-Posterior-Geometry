  burn_in_transitions: 128
  calibration_transitions: 256
  separation_transitions: 64
  cumulative_production_stages:
  - 2048
  - 4096
  max_likelihood_evaluations_per_chain: 1500000
  bracket_guard_evaluations: 10000
  scalar_save_stride: 1
  parameter_archive_stride: 16
  calibration_archive_stride: 8
  checkpoint_stride: 512
  continuation_gate: reference_and_static_diagnostics
reference_gates:
