# Generated from campaign.yaml: real sizes, short chains; checks memory/shape/GPU paths only.
schema_version: 1
campaign_id: scale_smoke_not_a_scientific_result
master_seed: 20260930
theory_source: _AISTATS_27_Wide_BNN_Posterior_Geometry (15).pdf
output_root: results/scale_smoke
replicates:
- 0
chain_ids:
- 0
- 1
- 2
- 3
model:
  activation: tanh
  biases: false
  dtype: float64
  amp: false
  tf32: false
  sigma: 1.0
  loss: summed_binary_centered_cross_entropy
  centered_logits:
  - -f/sqrt(2)
  - f/sqrt(2)
  class_one_probability: sigmoid(sqrt(2)*f)
  first_layer_input_scaling: none
  hidden_scaling: inverse_sqrt_width
  output_scaling: inverse_sqrt_width
  sampled_blocks: all
  shallow:
    weight_layers: 2
    widths:
    - 64
    - 4096
  deep:
    weight_layers: 3
    widths:
    - 32
    - 256
prior_centers:
  head: alternating_sign_inverse_sqrt_width
  head_operator_norm: 1.0
  first_layer: nested_standard_gaussian_row_bank
  row_bank_size: 4096
  later_hidden: zero
  paired_hidden_rows: false
  prior_coordinate_variance: 1.0
data:
  train_size: 128
  test_size: 1024
  input_dimension: 32
  input_distribution: standard_gaussian_normalized_to_unit_norm
  teacher: unnormalized_standard_gaussian_vector
  teacher_log_odds_multiplier: 2.0
  labels: bernoulli_teacher_probability
  share_across_width_and_architecture: true
  whiten: false
  redraw_for_unfavorable_results: false
domain:
  reference_sampling: full_posterior
  dynamics_sampling: full_posterior
  shallow_entropy: full_posterior
  deep_entropy: conditional_later_hidden_spectral
  static_pi_both_architectures: full_posterior
  spectral_cutoff_a: 2.5
  constrain_head: false
  constrain_first_layer: false
  sampling_projection_or_clipping: false
probes:
  train_indices:
  - 0
  - 16
  - 32
  - 48
  - 64
  - 80
  - 96
  - 112
  test_indices:
  - 0
  - 128
  - 256
  - 384
  - 512
  - 640
  - 768
  - 896
  entropy_train_indices:
  - 0
  - 32
  - 64
  - 96
  interaction_neurons:
  - 0
  - 1
  - 2
  - 3
  shallow_interaction_input_indices:
  - 0
  - 16
  - 32
  - 48
  deep_interaction_direction: alternating_sign_unit_vector
  linear_controls:
  - unit_head_projection
  - unit_first_layer_projection
  tilts:
  - -1.0
  - -0.5
  - 0.5
  - 1.0
  standardization_source: full_posterior_calibration_only
  degenerate_sd_relative_threshold: 1.0e-08
  selection_chain_folds:
  - - 0
    - 1
  - - 2
    - 3
