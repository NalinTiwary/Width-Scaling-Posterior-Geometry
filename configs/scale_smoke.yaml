  cumulative_retained_time_over_sigma_squared:
  - 4.0
  - 8.0
  scalar_save_stride: 1
  parameter_history: checkpoint_only
  checkpoint_stride: 2048
  endpoint_checks: narrowest_and_widest_all_replicates
  endpoint_equal_physical_time: true
  step_validation_relative_difference_max: 0.2
  architecture_wide_refinements_max: 1
