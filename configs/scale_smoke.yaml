  - 97.5
  block_integrated_time_multiplier: 10.0
  round_block_length_to_next_power_of_two: true
  nonoverlapping_blocks_per_chain_min: 20
  doubled_block_min_blocks: 10
  doubled_block_mcse_relative_difference_max: 0.3
  cross_replicate_summary: median_and_all_individual_points
  pool_data_replicates_as_iid_draws: false
