  bulk_ess_min: 1000
  tail_ess_min: 400
  split_mean_mcse_multiplier: 3.0
  split_mean_reference_sd_allowance: 0.05
  require_spectral_diagnostics_for_deep: true
  zero_exit_indicator_ess: undefined_not_failure_by_itself
dynamics:
  sampler: metropolis_adjusted_gaussian_preserving_langevin
